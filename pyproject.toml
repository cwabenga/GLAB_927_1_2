[project]
name = "glab-927-1-2"
version = "0.1.0"
description = "Business NLP text processing, entity recognition, and sentiment analysis using NLTK and TextBlob"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "textblob>=0.20.1",
]

[project.scripts]
glab-927-1-2 = "glab_927_1_2:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
